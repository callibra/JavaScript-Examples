<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gallery</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layer" id="la"></div><div class="layer" id="lb"></div>
<div class="shade"></div>

<div id="brand">
 <img id="logo" src="logo.png" alt="">
 <b id="siteTitle">My Gallery</b>
</div>
<div class="glass" id="count" aria-live="polite">0 / 0</div>

<div id="tools">
 <button class="btn glass" id="mus" title="Music play / stop"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path class="wave" d="M17 9a4 4 0 010 6"/><path class="slash" d="M17 9l5 6M22 9l-5 6"/></svg></button>
 <button class="btn glass" id="fx" title="Change transition / zoom effect"><svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg></button>
 <button class="btn glass" id="tm" title="Time per image (3 / 5 / 10 / 20 / 30 s)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></button>
 <button class="btn glass" id="eye" title="Hide / show controls"><svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
</div>

<button class="btn glass arrow" id="prev" title="Previous"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
<button class="btn glass arrow" id="next" title="Next"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
<button class="btn glass" id="play" title="Play / Stop"></button>

<div class="info glass" id="info">
 <h1 id="ttl"></h1>
</div>
<div class="glass" id="toast"></div>
<audio id="aud" preload="none"></audio>

<script src="script.js"></script>
</body>
</html>
